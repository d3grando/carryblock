[package]
name = "horizon-carryalong"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Carry Along: pick up chests, furnaces and small mobs and carry them, a native Horizon mod"
publish = false

[lib]
# This exact source is also injected as `crate::game::carryalong` by horizon-mixins.
path = "mixins/carryalong/runtime.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
