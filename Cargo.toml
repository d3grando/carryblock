[package]
name = "horizon-carryblock"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Carry Block: pick up chests, furnaces and small mobs and carry them, a native Horizon mod"
publish = false

[lib]
# This exact source is also injected as `crate::game::carryblock` by horizon-mixins.
path = "mixins/carryblock/runtime.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
